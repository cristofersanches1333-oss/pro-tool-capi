<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gold Analyzer V1</title>
<style>
:root{--bg:#0b0e13;--card:#131923;--line:#273244;--text:#edf2f7;--muted:#8fa0b5;--gold:#d6aa42;--green:#28c281;--red:#ef5b5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Arial;padding:18px}
.wrap{max-width:920px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:24px;margin:0}.tag{color:var(--gold);font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.wide{grid-column:1/-1}
label{display:block;color:var(--muted);margin-bottom:7px}input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0d121a;color:white;font-size:16px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--gold);color:#111;font-weight:800;cursor:pointer}
.value{font-size:26px;font-weight:800}.muted{color:var(--muted)}.signal{font-size:34px;font-weight:900}.buy{color:var(--green)}.sell{color:var(--red)}.wait{color:var(--gold)}
.bar{height:9px;background:#242c38;border-radius:8px;overflow:hidden;margin-top:10px}.fill{height:100%;background:var(--gold);width:0}
ul{line-height:1.8;padding-left:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head>
<body><div class="wrap">
<div class="head"><div><h1>GOLD ANALYZER</h1><div class="muted">Proyecto independiente · XAUUSD</div></div><div class="tag">V1</div></div>
<div class="grid">
<div class="card"><label>Precio actual XAUUSD</label><input id="price" type="number" step="0.01" placeholder="Ej. 3650.00"></div>
<div class="card"><label>Máximo reciente</label><input id="high" type="number" step="0.01" placeholder="Máximo"></div>
<div class="card"><label>Mínimo reciente</label><input id="low" type="number" step="0.01" placeholder="Mínimo"></div>
<div class="card"><label>EMA rápida</label><input id="fast" type="number" step="0.01" placeholder="EMA 20"></div>
<div class="card"><label>EMA lenta</label><input id="slow" type="number" step="0.01" placeholder="EMA 50"></div>
<div class="card"><label>RSI</label><input id="rsi" type="number" step="0.1" min="0" max="100" placeholder="0–100"></div>
<div class="card wide"><button onclick="analyze()">ANALIZAR ORO</button></div>
<div class="card"><label>Señal</label><div id="signal" class="signal wait">ESPERAR</div></div>
<div class="card"><label>Objetivo de extensión</label><div id="target" class="value">—</div><div class="muted">100 pips configurables</div></div>
<div class="card"><label>Confianza técnica</label><div id="score" class="value">0%</div><div class="bar"><div id="fill" class="fill"></div></div></div>
<div class="card wide"><label>Lectura del motor V1</label><ul id="why"><li>Introduce datos para iniciar el análisis.</li></ul></div>
</div></div>
<script>
const PIP=0.01, EXT=100*PIP; // V1: convención editable para XAUUSD
function n(id){return parseFloat(document.getElementById(id).value)}
function analyze(){
 let p=n('price'),h=n('high'),l=n('low'),f=n('fast'),s=n('slow'),r=n('rsi');
 if([p,h,l,f,s,r].some(Number.isNaN)||l>=h){alert('Completa valores válidos. El mínimo debe ser menor al máximo.');return}
 let bull=0,bear=0,why=[];
 if(f>s){bull+=30;why.push('EMA rápida por encima de EMA lenta: sesgo alcista.')}else{bear+=30;why.push('EMA rápida por debajo de EMA lenta: sesgo bajista.')}
 if(p>f){bull+=20;why.push('Precio sobre EMA rápida.')}else{bear+=20;why.push('Precio bajo EMA rápida.')}
 if(r>=52&&r<=70){bull+=25;why.push('RSI con momentum alcista sin extremo fuerte.')}
 else if(r<=48&&r>=30){bear+=25;why.push('RSI con momentum bajista sin extremo fuerte.')}
 else why.push('RSI sin confirmación clara o en zona extrema.');
 let pos=(p-l)/(h-l);
 if(pos>.55){bull+=15;why.push('Precio en mitad superior del rango reciente.')}
 else if(pos<.45){bear+=15;why.push('Precio en mitad inferior del rango reciente.')}
 else why.push('Precio cerca del centro del rango.');
 let diff=bull-bear, sig='ESPERAR', cls='wait',score=Math.min(100,Math.max(bull,bear));
 if(diff>=35){sig='COMPRA';cls='buy'} else if(diff<=-35){sig='VENTA';cls='sell'}
 let target=sig==='COMPRA'?p+EXT:sig==='VENTA'?p-EXT:null;
 document.getElementById('signal').textContent=sig;document.getElementById('signal').className='signal '+cls;
 document.getElementById('target').textContent=target?target.toFixed(2):'—';
 document.getElementById('score').textContent=score+'%';document.getElementById('fill').style.width=score+'%';
 why.push(sig==='ESPERAR'?'No hay confluencia suficiente para una entrada V1.':'Existe confluencia V1; validar riesgo y contexto antes de operar.');
 document.getElementById('why').innerHTML=why.map(x=>'<li>'+x+'</li>').join('');
}
</script></body></html>
